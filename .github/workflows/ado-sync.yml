name: ADO -> GitHub state sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be posted, but don't comment."
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ado-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip the run if the required secrets are not configured yet.
    if: ${{ vars.ADO_SYNC_ENABLED == 'true' || vars.ADO_SYNC_ENABLED == '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/copilot-triage/requirements.txt

      - name: Install dependencies
        run: pip install -r .github/copilot-triage/requirements.txt

      - name: Mint GitHub App installation token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.WAC_BOT_APP_ID }}
          private-key: ${{ secrets.WAC_BOT_APP_PRIVATE_KEY }}

      - name: Run ADO sync
        working-directory: .github/copilot-triage
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_STATE_GIST_ID: ${{ secrets.ADO_STATE_GIST_ID }}
          ADO_STATE_GIST_TOKEN: ${{ secrets.ADO_STATE_GIST_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python ado_sync.py --dry-run
          else
            python ado_sync.py
          fi

      - name: Upload sync debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ado-sync-debug-${{ github.run_id }}
          path: .github/copilot-triage/ado-sync-debug.json
          if-no-files-found: ignore
          retention-days: 14
